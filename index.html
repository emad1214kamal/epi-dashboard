<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPI Intelligence Dashboard v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'epi-blue': '#005baa', 'epi-green': '#10b981', 'epi-amber': '#f59e0b', 'epi-red': '#ef4444' } } } };
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <aside class="w-64 bg-epi-blue text-white flex flex-col shrink-0">
        <div class="h-16 flex items-center px-6 font-bold text-lg border-b border-blue-600">EPI Dashboard v3.0</div>
        <nav class="flex-1 py-4 px-3 space-y-1">
            <button data-target="overview" class="nav-btn w-full flex items-center px-3 py-2.5 rounded-lg bg-blue-700">Overview</button>
            <button data-target="coverage" class="nav-btn w-full flex items-center px-3 py-2.5 rounded-lg hover:bg-blue-600">Coverage</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6">
            <h2 id="page-title" class="font-bold text-slate-700">Overview</h2>
            <button id="sync-btn" class="bg-epi-blue text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Sync Data</button>
        </header>
        <div id="main-content" class="flex-1 overflow-y-auto p-8">
            <div class="text-slate-500 italic">Please sync data to view dashboard metrics.</div>
        </div>
    </main>

    <div id="alert-container" class="fixed top-4 right-4 z-50"></div>

    <script>
        const Config = {
            apiEndpoint: 'https://script.google.com/macros/s/AKfycbwH8aKuvSUNS0zgnoemkxdmnUZAPx1chui_xjPztqiM6cGzG1CFhVxuQN0179l8LJCQhQ/exec',
            datasets: [
                'coverage.csv', 'dropout.csv', 'logistics.csv', 'outliers.csv', 'quality.csv', 
                'reconciliation_district.csv', 'reconciliation_governorate.csv', 'reconciliation_national.csv', 
                'safe_stock_district.csv', 'safe_stock_governorate.csv', 'safe_stock_national.csv', 'zero_dose.csv'
            ]
        };

        const StorageEngine = {
            db: null,
            init: () => new Promise(resolve => {
                const req = indexedDB.open('EPIDashboardDB', 1);
                req.onupgradeneeded = e => Config.datasets.forEach(ds => e.target.result.createObjectStore(ds.replace('.csv', ''), { autoIncrement: true }));
                req.onsuccess = e => { StorageEngine.db = e.target.result; resolve(); };
            }),
            saveData: (store, data) => new Promise(resolve => {
                const tx = StorageEngine.db.transaction(store, 'readwrite');
                tx.objectStore(store).clear();
                data.forEach(item => tx.objectStore(store).add(item));
                tx.oncomplete = resolve;
            })
        };

        const CoreApp = {
            showAlert: (msg, type) => {
                const div = document.createElement('div');
                div.className = `p-4 mb-2 rounded shadow ${type === 'error' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`;
                div.textContent = msg;
                document.getElementById('alert-container').appendChild(div);
                setTimeout(() => div.remove(), 6000);
            },
            init: async () => {
                await StorageEngine.init();
                document.getElementById('sync-btn').addEventListener('click', async () => {
                    const btn = document.getElementById('sync-btn');
                    btn.disabled = true; btn.textContent = 'Syncing...';
                    
                    console.log("--- Starting Synchronization ---");
                    let successCount = 0;
                    
                    for (const fileName of Config.datasets) {
                        try {
                            const url = `${Config.apiEndpoint}?action=download&fileName=${fileName}`;
                            console.log("Requesting: " + url);
                            
                            const response = await fetch(url, { method: 'GET', mode: 'no-cors' });
                            
                            // ملاحظة: مع mode: 'no-cors' لن نستطيع قراءة الـ status code أو الـ body مباشرة
                            // سنحاول القراءة المباشرة الآن
                            const text = await response.text(); 
                            
                            console.log("Response received for " + fileName);
                            
                            const data = Papa.parse(text, { header: true }).data;
                            await StorageEngine.saveData(fileName.replace('.csv', ''), data);
                            successCount++;
                            console.log("Successfully saved: " + fileName);
                        } catch (e) {
                            console.error("Critical error for " + fileName + ":", e);
                            CoreApp.showAlert("Failed: " + fileName, 'error');
                        }
                    }

                    btn.disabled = false; btn.textContent = 'Sync Data';
                    if (successCount === Config.datasets.length) {
                        CoreApp.showAlert('Synchronization successful!', 'success');
                    } else {
                        CoreApp.showAlert(`Some datasets failed (${successCount}/${Config.datasets.length}). Check Console.`, 'error');
                    }
                });
            }
        };

        window.onload = CoreApp.init;
    </script>
</body>
</html>
